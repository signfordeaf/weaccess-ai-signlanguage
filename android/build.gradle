buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.8.10')}")
    }
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['SignLanguageTranslation_' + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['SignLanguageTranslation_' + name]).toInteger()
}

android {
    namespace "com.signlanguagetranslation"
    compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault('minSdkVersion')
        targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        disable 'GradleCompatible'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // The source roots are deliberately left at the AGP defaults, which are the
    // paths this block used to spell out by hand — but resolved through
    // `canonicalPath`. When an app links the SDK with a symlink, as both demo
    // apps and every `npm link` setup do, the resolved path and the project
    // directory differ. The Kotlin plugin keeps adding `$projectDir/src/main/java`
    // regardless, so every class was compiled twice under two names and the
    // build failed with "Redeclaration" for all of them.
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.8.10')}"

    // The SDK plays video itself rather than depending on `react-native-video`,
    // so integrators install one package. `media3-ui` is deliberately absent:
    // its PlayerView is backed by a SurfaceView, which ignores the stage's
    // rounded clip and draws over the mark and the loading veil. The view hosts
    // a TextureView directly instead.
    implementation "androidx.media3:media3-exoplayer:1.2.0"
}
